name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  ci:
    name: build + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          npm ci
          pip install -r requirements.txt

      - name: Validate data (JSON Schema + consistency)
        run: python scripts/validate.py

      - name: Build site
        run: npm run build

      - name: Unit test
        run: npm test
