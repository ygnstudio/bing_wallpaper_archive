name: Detect UHD 4K

on:
  # 历史图片已全量探测，日常增量由 update.yml 兜底。
  # 此 workflow 仅用于需要手动强制重探测全量图片时触发。
  workflow_dispatch:
    inputs:
      force_all:
        description: '强制重新探测所有图片'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: write
  actions: write

concurrency:
  group: wallpaper-archive-update
  cancel-in-progress: false

jobs:
  detect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Detect UHD availability
        run: python3 scripts/detect_uhd.py ${{ inputs.force_all == true && '--force' || '' }}

      - name: Regenerate index.json
        run: python3 scripts/generate_index.py

      - name: Commit and push if changed
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Include regenerated per-year detail files as well as the master index.
          git add data
          if git diff --cached --quiet; then
            echo "No changes to commit"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "data: 自动更新 4K 探测结果 $(date +%Y-%m-%d)"
            git push origin main
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      # Cloudflare follows main through Git integration; dispatch the GitHub backup explicitly.
      - name: Trigger GitHub Pages backup deployment
        if: steps.commit.outputs.publish == 'true'
        run: gh workflow run pages.yml --ref main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
