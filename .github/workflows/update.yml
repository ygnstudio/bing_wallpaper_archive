name: Daily Update

on:
  schedule:
    - cron: "30 16 * * *"   # 00:30 Beijing time (Bing refreshes ~00:00 UTC+8)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch today's wallpaper
        run: python scripts/download.py

      - name: Rebuild index
        run: python scripts/generate_index.py

      - name: Verify archive (no missing thumbnails)
        run: python scripts/check_archive.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data thumbnails site
          git diff --cached --quiet && echo "no changes" || (git commit -m "daily: update wallpaper" && git pull --rebase --autostash && git push)
