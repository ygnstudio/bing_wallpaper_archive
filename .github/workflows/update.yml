name: Daily Update

on:
  schedule:
    - cron: "0 1 * * *"   # 01:00 UTC = 09:00 Beijing：Bing 换图(~北京时间次日凌晨)之后抓最新已发布图，当天早间入库
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install VLM dependencies
        run: |
          pip install --quiet --upgrade pip
          pip install --quiet torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet transformers qwen-vl-utils huggingface_hub

      - name: Cache VLM model
        uses: actions/cache@v5
        with:
          path: ~/.cache/huggingface
          key: qwen2-vl-2b-v1
          restore-keys: |
            qwen2-vl-2b-

      - name: Prefetch VLM model (no-op on cache hit)
        run: |
          python -c "from huggingface_hub import snapshot_download; snapshot_download('Qwen/Qwen2-VL-2B-Instruct'); print('model ready')"

      - name: Fetch today's wallpaper
        run: python scripts/download.py

      - name: Classify (color + keyword category)
        run: python scripts/classify.py

      - name: VLM classify latest wallpaper
        run: python scripts/vlm_classify.py --latest

      - name: Detect missing UHD availability
        run: python scripts/detect_uhd.py

      - name: Rebuild index
        run: python scripts/generate_index.py

      - name: Update README stats
        run: python scripts/update_readme_stats.py

      - name: Verify archive (no missing thumbnails)
        run: python scripts/check_archive.py

      - name: Commit and push
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data thumbnails site README.md
          if git diff --cached --quiet; then
            echo "no changes"
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            git commit -m "daily: update wallpaper"
            git pull --rebase --autostash
            git push
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Trigger Pages deployment
        if: steps.commit.outputs.changed == 'true'
        run: gh workflow run pages.yml --ref main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
