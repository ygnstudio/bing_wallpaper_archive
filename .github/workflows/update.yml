name: Daily Update

on:
  schedule:
    - cron: "0 9 * * *"   # 09:00 UTC = 17:00 Beijing：Bing 换图(~15:00/16:00 北京)之后抓当天新图，当天傍晚入库
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install VLM dependencies
        run: |
          pip install --quiet --upgrade pip
          pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet transformers qwen-vl-utils huggingface_hub

      - name: Cache VLM model
        uses: actions/cache@v5
        with:
          path: ~/.cache/huggingface
          key: qwen2-vl-2b-v1
          restore-keys: |
            qwen2-vl-2b-

      - name: Prefetch VLM model (no-op on cache hit)
        run: |
          python -c "from huggingface_hub import snapshot_download; snapshot_download('Qwen/Qwen2-VL-2B-Instruct'); print('model ready')"

      - name: Fetch today's wallpaper
        run: python scripts/download.py

      - name: Classify (color + keyword category)
        run: python scripts/classify.py

      - name: VLM classify today's wallpaper
        run: |
          TODAY=$(date -u +%Y%m%d)
          python scripts/vlm_classify.py --date $TODAY

      - name: Rebuild index
        run: python scripts/generate_index.py

      - name: Verify archive (no missing thumbnails)
        run: python scripts/check_archive.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data thumbnails site
          git diff --cached --quiet && echo "no changes" || (git commit -m "daily: update wallpaper" && git pull --rebase --autostash && git push)
