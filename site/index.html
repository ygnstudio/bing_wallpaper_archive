<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bing 每日壁纸归档</title>
  <link rel="stylesheet" href="./assets/style.css?v=20260820n">
</head>
<body>
  <nav class="topnav">
    <a class="brand" href="./" aria-label="首页">
      <span class="logo" aria-hidden="true">B</span>
      <span class="brand-title">Bing 每日壁纸归档</span>
    </a>
    <div class="nav-search">
      <svg class="search-icon" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
      <input id="search" type="search" placeholder="搜索标题、版权、日期…" />
    </div>
  </nav>

  <section id="hero" class="hero" hidden>
    <div class="hero-bg">
      <img id="hero-bg-img" alt="">
    </div>
    <div class="hero-overlay" aria-hidden="true"></div>
    <div class="hero-content">
      <div class="hero-card">
        <div class="hero-tag">最新壁纸 · <span id="hero-date"></span></div>
        <h2 id="hero-title"></h2>
        <p id="hero-desc"></p>
        <div class="hero-actions">
          <button id="hero-download" class="btn-primary" type="button">
            <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M12 3v10.2l3.6-3.6 1.4 1.4L12 16 7 11l1.4-1.4L12 13.2zM5 18h14v2H5z"/></svg>
            <span id="hero-download-text">下载 UHD 4K</span>
          </button>
          <button id="hero-view" class="btn-secondary" type="button">
            <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>
            查看原图
          </button>
        </div>
      </div>
    </div>
  </section>

  <div class="filter-bar">
    <div class="filter-row">
      <div class="filter-group" id="cat-pills" role="tablist" aria-label="分类筛选"></div>
    </div>
    <div class="filter-row">
      <div class="filter-group color-group" id="color-pills" role="tablist" aria-label="颜色筛选"></div>
    </div>
    <div class="filter-row date-row">
      <div class="date-range">
        <span class="date-range-label">日期范围</span>
        <button type="button" class="month-trigger" id="date-from-trigger" aria-label="选择起始年月">
          <span class="month-trigger-text" data-placeholder="起始年月"></span>
        </button>
        <input type="hidden" id="date-from">
        <button type="button" id="date-swap" class="date-swap" aria-label="交换起始与结束日期" title="交换日期">
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
            <path fill="currentColor" d="M6.99 11L3 15l3.99 4v-3H14v-2H6.99v-3zM21 9l-3.99-4v3H10v2h7.01v3L21 9z"/>
          </svg>
        </button>
        <button type="button" class="month-trigger" id="date-to-trigger" aria-label="选择结束年月">
          <span class="month-trigger-text" data-placeholder="结束年月"></span>
        </button>
        <input type="hidden" id="date-to">
        <button id="date-clear" class="btn-ghost" type="button">清除</button>
      </div>
      <span id="filter-count" class="filter-count"></span>
      <div id="month-picker" class="month-picker" hidden>
        <div class="mp-header">
          <button type="button" id="mp-prev" class="mp-nav" aria-label="上一年">‹</button>
          <span id="mp-year" class="mp-year">2026</span>
          <button type="button" id="mp-next" class="mp-nav" aria-label="下一年">›</button>
        </div>
        <div class="mp-grid" id="mp-grid"></div>
        <div class="mp-footer">
          <button type="button" id="mp-clear" class="mp-btn">清除</button>
          <button type="button" id="mp-this" class="mp-btn">本月</button>
        </div>
      </div>
    </div>
  </div>

  <div class="section-header">
    <h2>全部壁纸</h2>
    <div class="section-meta">
      <span id="archive-stats">已归档 0 张 · 每日更新</span>
    </div>
  </div>

  <main id="grid" class="grid"></main>
  <div id="sentinel" class="sentinel">加载更多…</div>
  <p id="empty" class="empty" hidden>没有匹配的壁纸。</p>

  <div id="batchbar" class="batchbar">
    <div id="batch-panel" class="batch-panel" hidden>
      <div class="batch-row">已选 <strong id="batch-count">0</strong> 张</div>
      <label class="batch-res">分辨率
        <select id="batch-res" aria-label="打包分辨率">
          <option value="1920x1080">1080p</option>
          <option value="UHD" selected>UHD 4K</option>
        </select>
      </label>
      <span id="batch-res-note" class="batch-note" hidden></span>
      <div class="batch-actions">
        <button id="batch-selectall" type="button" class="ghost">全选当前</button>
        <button id="batch-clear" type="button" class="ghost">取消</button>
        <button id="batch-zip" type="button">打包下载</button>
      </div>
      <span id="batch-progress" class="batch-progress"></span>
    </div>
    <button id="batch-toggle" class="fab" type="button" aria-label="批量下载选项">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M12 3v10.2l3.6-3.6 1.4 1.4L12 16 7 11l1.4-1.4L12 13.2zM5 18h14v2H5z"/></svg>
      <span id="batch-badge" class="batch-badge" hidden>0</span>
    </button>
  </div>

  <div id="lightbox" class="lightbox" hidden>
    <button id="close" aria-label="关闭">×</button>
    <img id="lb-img" alt="">
    <div class="lb-meta">
      <h2 id="lb-title"></h2>
      <p id="lb-copyright"></p>
      <p id="lb-note" class="lb-note" hidden></p>
      <div class="lb-res-row">
        <label for="lb-res">全图分辨率</label>
        <select id="lb-res" aria-label="全图分辨率"></select>
      </div>
      <div class="lb-actions">
        <a id="lb-link" target="_blank" rel="noopener">在新窗口打开原图 ↗</a>
        <a id="lb-download" download>下载全图</a>
        <button id="lb-copy" type="button">复制链接</button>
        <button id="lb-copy-md" type="button">复制 Markdown</button>
      </div>
      <p class="lb-hint">原图直链来自 Bing。部分浏览器对跨域下载会改为直接打开，此时可右键图片「图片另存为」。</p>
    </div>
  </div>

  <footer class="footer">
    <a class="brand" href="./" aria-label="首页">
      <span class="logo" aria-hidden="true">B</span>
      <div>
        <div class="brand-title">Bing 每日壁纸归档</div>
        <div class="brand-sub">每日精选 · 全球风光一键收藏</div>
      </div>
    </a>
    <div class="footer-links">
      <a href="./about.html">关于</a>
      <a href="https://github.com/ygnstudio/bing_wallpaper_archive" target="_blank" rel="noopener">GitHub</a>
    </div>
  </footer>

  <script src="./assets/app.js?v=20260820o"></script>
</body>
</html>
