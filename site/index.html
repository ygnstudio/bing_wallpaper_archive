<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bing 每日壁纸归档</title>
  <link rel="stylesheet" href="./assets/style.css">
</head>
<body>
  <header>
    <h1>Bing 每日壁纸归档</h1>
    <p id="subtitle">加载中…</p>
    <div class="controls">
      <input id="search" type="search" placeholder="搜索标题 / 版权 / 日期…" />
      <select id="year" aria-label="年份筛选"><option value="">全部年份</option></select>
      <select id="month" aria-label="月份筛选"><option value="">全部月份</option></select>
      <select id="category" aria-label="分类筛选"><option value="">全部分类</option></select>
      <select id="color" aria-label="颜色筛选"><option value="">全部颜色</option></select>
    </div>
  </header>

  <main id="grid" class="grid"></main>
  <div id="sentinel" class="sentinel">加载更多…</div>
  <p id="empty" class="empty" hidden>没有匹配的壁纸。</p>

  <div id="batchbar" class="batchbar">
    <span id="batch-count">已选 0 张</span>
    <label class="batch-res">分辨率
      <select id="batch-res" aria-label="打包分辨率">
        <option value="1920x1080">1080p</option>
        <option value="UHD">UHD 4K</option>
      </select>
    </label>
    <button id="batch-selectall" type="button" class="ghost">全选当前结果</button>
    <button id="batch-zip" type="button">打包下载（至少 2 张）</button>
    <button id="batch-clear" type="button" class="ghost">取消选择</button>
    <span id="batch-progress" class="batch-progress"></span>
  </div>

  <div id="lightbox" class="lightbox" hidden>
    <button id="close" aria-label="关闭">×</button>
    <img id="lb-img" alt="">
    <div class="lb-meta">
      <h2 id="lb-title"></h2>
      <p id="lb-copyright"></p>
      <p id="lb-note" class="lb-note" hidden></p>
      <div class="lb-res-row">
        <label for="lb-res">全图分辨率</label>
        <select id="lb-res" aria-label="全图分辨率"></select>
      </div>
      <div class="lb-actions">
        <a id="lb-link" target="_blank" rel="noopener">在新窗口打开原图 ↗</a>
        <a id="lb-download" download>下载全图</a>
        <button id="lb-copy" type="button">复制链接</button>
      </div>
      <p class="lb-hint">原图直链来自 Bing。部分浏览器对跨域下载会改为直接打开，此时可右键图片「图片另存为」。</p>
    </div>
  </div>

  <script src="./assets/app.js"></script>
</body>
</html>
